<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard CMS — WebAR Local</title>
    <!-- Dependência externa -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <!-- Estilo Local -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="panel list-panel">
        <h2>Mapeamento de Alvos e Modelos</h2>
        <div id="items-container">Carregando dados...</div>
        <br>
        <button id="btn-salvar">Salvar Alterações</button>
    </div>

    <div class="panel preview-panel">
        <h2>Pré-visualização 3D (PC)</h2>
        <model-viewer id="viewer" src="" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
        <p id="preview-info">Selecione um item para inspecionar</p>
    </div>

    <!-- Script Local -->
    <script src="js/dashboard.js"></script>
</body>

</html>
