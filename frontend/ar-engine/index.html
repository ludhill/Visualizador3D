<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Experience</title>
  
  <!-- Antes (Dependente de CDN externa) -->
  <!-- <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script> -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script> -->

  <!-- Agora (100% Local / Offline) -->
  <script src="vendor/aframe.min.js"></script>
  <script src="vendor/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; position: fixed; background-color: #000;
      font-family: sans-serif;
    }
    
    a-scene {
      width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;
    }

    /* Interface de Acesso Negado */
    .denied-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #111; color: #ff4d4d; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; text-align: center; padding: 20px;
    }
    .denied-overlay h1 { font-size: 22px; margin-bottom: 10px; color: #ff4d4d; }
    .denied-overlay p { color: #ccc; max-width: 300px; font-size: 14px; line-height: 1.4; }

    /* Modal de Economia de Bateria */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); color: white;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; text-align: center; padding: 20px;
    }
    .modal-overlay button {
      padding: 12px 24px; font-size: 16px; background: #007bff; color: white;
      border: none; border-radius: 6px; cursor: pointer; margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Tela de Bloqueio por Token Ausente/Inválido -->
  <div id="denied-modal" class="denied-overlay">
    <h1>Acesso Não Autorizado</h1>
    <p>Por favor, escaneie o QR Code oficial da exposição para acessar esta experiência WebAR.</p>
  </div>

  <!-- Modal de Economia de Bateria -->
  <div id="sleep-modal" class="modal-overlay">
    <h2>Sessão Pausada</h2>
    <p>A câmera foi desligada para economizar bateria do seu dispositivo.</p>
    <button id="btn-reconnect">Toque para Reativar Câmera</button>
  </div>

  <!-- Cena A-Frame (Propriedades do MindAR são injetadas via JavaScript) -->
  <a-scene 
    mindar-image="imageTargetSrc: /storage/targets/targets.mind; autoStart: true; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script type="module" src="js/App.js"></script>
</body>
</html>
